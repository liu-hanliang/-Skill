[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-statement-scan-statistics"
version = "0.1.0"
description = "Local-first OCR workflow for traceable bank-statement statistics"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "openpyxl>=3.1",
]

[project.optional-dependencies]
pdf = ["PyMuPDF>=1.23", "Pillow>=9.0"]
test = ["pytest>=7.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
